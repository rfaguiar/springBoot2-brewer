apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: compose
    mode: docker
  # Anexa o coletor OTLP (ingester) a uma rede Docker externa compartilhada,
  # para que o docker-compose.yml da aplicação brewer consiga enviar telemetria.
  patches:
    - target: "deployment\\compose.yaml"
      operations:
        - op: add
          path: /networks/brewer-observability
          value:
            name: brewer-observability
            external: true
        - op: add
          path: /services/ingester/networks/brewer-observability
          value: {}
