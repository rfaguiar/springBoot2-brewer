services:
  mysql:
    image: mysql:8.0
    container_name: brewer-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: brewer-springboot
    ports:
      - "3306:3306"
    volumes:
      - brewer-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brewer-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/brewer-springboot?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      DB_HOST: mysql
      DB_PORT: "3306"
      BREWER_EMAIL_USERNAME: ""
      BREWER_EMAIL_PASSWORD: ""
      # Porta 8080 do host está ocupada pela UI do SigNoz; app publicado em 8081.
      BREWER_FOTO_STORAGE_LOCAL_URL_BASE: http://localhost:8081/fotos/
      BREWER_FOTO_STORAGE_LOCAL_PATH: /home/spring/.brewerfotos
      # Observabilidade OpenTelemetry -> SigNoz (coletor "ingester" na rede externa abaixo).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://ingester:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: brewer-springboot
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=brewer,deployment.environment=docker
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://ingester:4318/v1/metrics
      # Agent baixado no Dockerfile (Fase 3); default local (ENV JAVA_OPTS="") fica sem o agent.
      JAVA_OPTS: -javaagent:/app/opentelemetry-javaagent.jar
    ports:
      - "8081:8080"
    networks:
      - default
      - brewer-observability

networks:
  default: {}
  brewer-observability:
    external: true

volumes:
  brewer-mysql-data:

