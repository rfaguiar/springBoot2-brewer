<!DOCTYPE html>
<html lang="pt"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutSimples}">

    <th:block layout:fragment="conteudo">

        <!-- Status sem fragmento próprio caem no fragmento genérico de 500 (evita falha ao resolver o include). -->
        <th:block th:with="fragmentoErro=${#lists.contains({400, 403, 404, 500}, status)} ? ${status} : 500">
            <th:block th:replace="|fragments/erros/${fragmentoErro}|" />
        </th:block>

    </th:block>

</html>
